# `supabase/config.toml` — Edge Function JWT verification

# For this project, auth is enforced inside each function (`CRON_SECRET` or user JWT).
# See CRON_AND_SECRETS.md.

[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_enforce_minimum_signup_age"

[functions.schedule-daily-challenge]
verify_jwt = false

[functions.realtime-token]
verify_jwt = false

[functions.relay-domain-events]
verify_jwt = false

[functions.orchestrate-doji]
verify_jwt = false

[functions.fanout-doji-push]
verify_jwt = false

[functions.run-data-maintenance]
verify_jwt = false

[functions.operational-health]
verify_jwt = false

# Called by pg_net and the Cloudflare health worker. The function validates the
# dedicated cron/outbox secret itself; Supabase JWT verification would reject
# those non-user service credentials before the handler can authorize them.
[functions.send-admin-email]
verify_jwt = false
