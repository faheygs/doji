name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo-doctor
      - run: npx tsc --noEmit
      - run: npm run lint -- --quiet
      - run: npm run check:size
      - run: npm test -- --runInBand --coverage
      - run: npm run test:fanout-model
      # Expo/Metro build-tool advisories are tracked separately; a critical
      # production advisory always blocks release.
      - run: npm audit --omit=dev --audit-level=critical
      - name: Typecheck Cloudflare orchestrator
        working-directory: infra/doji-orchestrator
        run: npm ci && npm run typecheck
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck changed edge-function paths
        run: >-
          deno check
          supabase/functions/fanout-doji-push/index.ts
          supabase/functions/run-data-maintenance/index.ts

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0
      - run: supabase db start
      - run: supabase test db
      - run: supabase db lint --local --level warning
