name: Admin staging
run-name: Stage admin ${{ github.event.workflow_run.head_sha }}
on:
  workflow_run:
    workflows: [Quality gates]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: admin-staging
  cancel-in-progress: false
jobs:
  plan:
    if: >-
      vars.ADMIN_DEPLOYMENTS_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      changed: ${{ steps.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - id: plan
        run: node scripts/admin-release-ci.mts stage
        env:
          GH_TOKEN: ${{ github.token }}
  package:
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix infra/doji-orchestrator
      - run: npm ci --prefix web --ignore-scripts
      - run: node scripts/build-admin-release.mts "$RUNNER_TEMP/admin-release" "$SOURCE_SHA"
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: admin-release
          path: ${{ runner.temp }}/admin-release
          if-no-files-found: error
          retention-days: 14
  deploy:
    needs: [plan, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: admin-staging
      url: https://admin-staging.dojipro.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci --prefix infra/doji-orchestrator
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: admin-release
          path: ${{ runner.temp }}/admin-release
      - name: Deploy only the admin staging Pages package
        run: node scripts/deploy-admin-release.mts "$RUNNER_TEMP/admin-release/staging" staging "$SOURCE_SHA"
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: admin-staging-receipt
          path: ${{ runner.temp }}/admin-release/staging/deployment.json
          if-no-files-found: ignore
          retention-days: 14
