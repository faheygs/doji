<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Doji — UI/UX Mockups</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#111;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif}
#app{display:flex;height:100vh;overflow:hidden}
/* Sidebar */
.sidebar{width:200px;flex-shrink:0;background:#0A0A0A;border-right:1px solid #222;overflow-y:auto;display:flex;flex-direction:column;gap:0}
.sidebar-header{padding:20px 16px 12px;border-bottom:1px solid #222}
.sidebar-logo{font-size:22px;font-weight:900;color:#FF6B35;letter-spacing:-0.03em}
.sidebar-sub{font-size:11px;color:#444;margin-top:3px;font-weight:500}
.nav-section{padding:16px 0 4px}
.nav-section-title{padding:0 16px 6px;font-size:9px;font-weight:800;color:#444;letter-spacing:0.1em;text-transform:uppercase}
.nav-item{display:block;padding:7px 16px;font-size:12px;color:#666;cursor:pointer;border-left:2px solid transparent;transition:all 0.15s;text-decoration:none}
.nav-item:hover{color:#ccc;background:#161616}
.nav-item.active{color:#FF6B35;border-left-color:#FF6B35;background:#1a0f0a}
/* Main */
.main{flex:1;overflow-y:auto;padding:40px 48px 80px}
/* Section */
.section{margin-bottom:72px}
.section-header{margin-bottom:32px;padding-bottom:16px;border-bottom:1px solid #222}
.section-title{font-size:24px;font-weight:800;color:#fff;letter-spacing:-0.02em}
.section-sub{font-size:13px;color:#555;margin-top:5px}
/* Screen pair */
.screen-row{margin-bottom:48px}
.screen-label{font-size:11px;font-weight:700;color:#555;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:14px}
.phone-pair{display:flex;gap:28px;align-items:flex-start}
.phone-mode-label{font-size:10px;color:#333;font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.08em}
.phone-outer{width:256px;height:554px;overflow:hidden;flex-shrink:0;border-radius:35px}
.phone-inner{transform:scale(0.652);transform-origin:top left;width:393px;height:852px}
/* Animations */
@keyframes doji-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.85)}}
@keyframes xp-float{0%{opacity:0;transform:translateY(20px)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#0a0a0a}
::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:3px}
</style>
</head>
<body>
<div id="app"></div>
<script type="text/babel">
// ─────────────────────────────────────────────────────────────
// TOKENS
// ─────────────────────────────────────────────────────────────
const DojiT = {
  light:{bg:'#FFFFFF',surface:'#F5F5F5',surfaceElevated:'#FFFFFF',textPrimary:'#0A0A0A',textSecondary:'#6B6B6B',textTertiary:'#9B9B9B',border:'#E5E5E5'},
  dark:{bg:'#0A0A0A',surface:'#141414',surfaceElevated:'#1E1E1E',textPrimary:'#FFFFFF',textSecondary:'#9B9B9B',textTertiary:'#5A5A5A',border:'#2A2A2A'},
  sem:{primary:'#FF6B35',success:'#4CAF50',error:'#F44336',xpGold:'#FFD700',level:'#8B5CF6',bronze:'#CD7F32',silver:'#C0C0C0',gold:'#FFD700',diamond:'#00D4FF'},
};
const tok = m => m==='dark'?DojiT.dark:DojiT.light;
const SF = `-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif`;
const P = DojiT.sem.primary;

// ─────────────────────────────────────────────────────────────
// CORE COMPONENTS
// ─────────────────────────────────────────────────────────────
const Avatar = ({size=40,seed=0,initials,bg})=>{
  const pal=['#FF6B35','#8B5CF6','#4CAF50','#00D4FF','#E91E63','#FF9800','#2196F3','#009688'];
  const abbrs=['AJ','PK','MT','ZL','EW','FZ','BL','CS','DR','HN'];
  return <div style={{width:size,height:size,borderRadius:'50%',background:bg||pal[seed%pal.length],display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
    <span style={{color:'#fff',fontSize:size*0.36,fontWeight:700,fontFamily:SF}}>{initials||abbrs[seed%abbrs.length]}</span>
  </div>;
};

const StatusBar = ({mode='light',time='9:41'})=>{
  const t=tok(mode); const c=t.textPrimary;
  return <div style={{position:'absolute',top:0,left:0,right:0,height:59,display:'flex',alignItems:'flex-end',paddingBottom:10,paddingLeft:24,paddingRight:20,justifyContent:'space-between',zIndex:200,pointerEvents:'none'}}>
    <span style={{fontSize:15,fontWeight:600,color:c,fontFamily:SF}}>{time}</span>
    <div style={{display:'flex',gap:5,alignItems:'center'}}>
      <svg width="17" height="11" viewBox="0 0 17 11" fill={c}><rect x="0" y="6" width="3" height="5" rx="0.8"/><rect x="4.5" y="4" width="3" height="7" rx="0.8"/><rect x="9" y="2" width="3" height="9" rx="0.8"/><rect x="13.5" y="0" width="3" height="11" rx="0.8" opacity="0.3"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="20" height="11" rx="2.8" stroke={c} strokeWidth="1" opacity="0.4"/><rect x="21.5" y="3.5" width="2.5" height="5" rx="1.5" fill={c} opacity="0.4"/><rect x="2" y="2" width="14" height="8" rx="1.8" fill={c}/></svg>
    </div>
  </div>;
};

const Phone = ({mode='light',children})=>{
  const dark=mode==='dark';
  return <div style={{width:393,height:852,borderRadius:54,overflow:'hidden',position:'relative',fontFamily:SF,background:dark?'#0A0A0A':'#FFFFFF',boxShadow:dark?'0 0 0 10px #1C1C1C,0 0 0 11px rgba(255,255,255,0.06)':'0 0 0 10px #E2E2E2,0 0 0 11px rgba(0,0,0,0.04)'}}>
    <div style={{position:'absolute',top:14,left:'50%',transform:'translateX(-50%)',width:126,height:37,background:'#000',borderRadius:20,zIndex:400,pointerEvents:'none'}}/>
    <div style={{position:'absolute',bottom:8,left:'50%',transform:'translateX(-50%)',width:134,height:5,background:dark?'rgba(255,255,255,0.28)':'rgba(0,0,0,0.22)',borderRadius:100,zIndex:400,pointerEvents:'none'}}/>
    {children}
  </div>;
};

const BottomNav = ({mode='light',active='home'})=>{
  const t=tok(mode);
  const tabs=[
    {id:'home',l:'Home',d:'M3 10.5L12 3l9 7.5V21H15v-5.25h-6V21H3z',fill:true},
    {id:'leaderboard',l:'Board',d:'M3 21v-6h4v6H3zm7-10v10h4V11h-4zm7 5v5h4v-5h-4z',fill:true},
    {id:'friends',l:'Friends',d:'M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z',fill:true},
    {id:'submit',l:'Submit',d:'M12 5v14M5 12h14',fill:false},
    {id:'profile',l:'Profile',d:'M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v2h20v-2c0-3.3-6.7-5-10-5z',fill:true},
  ];
  return <div style={{position:'absolute',bottom:0,left:0,right:0,height:83,background:t.surfaceElevated,borderTop:`1px solid ${t.border}`,display:'flex',alignItems:'flex-start',paddingTop:8,zIndex:300}}>
    {tabs.map(tab=>{
      const on=active===tab.id;
      return <div key={tab.id} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3}}>
        <svg width="24" height="24" viewBox="0 0 24 24" fill={!tab.fill?'none':(on?P:t.textTertiary)} stroke={!tab.fill?(on?P:t.textTertiary):'none'} strokeWidth={!tab.fill?2.5:0} strokeLinecap="round"><path d={tab.d}/></svg>
        <span style={{fontSize:10,fontWeight:on?600:400,color:on?P:t.textTertiary,fontFamily:SF}}>{tab.l}</span>
      </div>;
    })}
  </div>;
};

const PrimaryBtn=({label,mode='light',disabled=false,style:ex={}})=>(
  <div style={{background:disabled?'#999':P,color:'#fff',padding:'17px 24px',borderRadius:16,fontSize:17,fontWeight:700,textAlign:'center',cursor:'pointer',fontFamily:SF,...ex}}>{label}</div>
);
const GhostBtn=({label,mode='light',style:ex={}})=>{const t=tok(mode);return <div style={{border:`1.5px solid ${t.border}`,color:t.textPrimary,padding:'17px 24px',borderRadius:16,fontSize:17,fontWeight:600,textAlign:'center',cursor:'pointer',fontFamily:SF,...ex}}>{label}</div>;};
const TextInput=({placeholder,value,mode='light',style:ex={},prefix,suffix})=>{const t=tok(mode);return <div style={{background:t.surface,borderRadius:14,padding:'15px 16px',border:`1.5px solid ${t.border}`,display:'flex',alignItems:'center',gap:8,...ex}}>{prefix&&<span style={{color:t.textTertiary,fontFamily:SF,fontSize:16}}>{prefix}</span>}<span style={{flex:1,fontSize:16,fontFamily:SF,color:value?t.textPrimary:t.textTertiary}}>{value||placeholder}</span>{suffix}</div>;};

const ScreenHeader=({title,mode='light',left,right,borderless=false})=>{const t=tok(mode);return <div style={{height:52,display:'flex',alignItems:'center',paddingLeft:20,paddingRight:20,justifyContent:'space-between',borderBottom:borderless?'none':`1px solid ${t.border}`,flexShrink:0}}><div style={{width:60,display:'flex',alignItems:'center'}}>{left}</div>{title&&<span style={{fontSize:17,fontWeight:700,color:t.textPrimary,fontFamily:SF}}>{title}</span>}{!title&&<div style={{flex:1}}/>}<div style={{width:60,display:'flex',justifyContent:'flex-end',alignItems:'center'}}>{right}</div></div>;};

const BackChevron=({mode='light'})=><svg width="10" height="18" viewBox="0 0 10 18" fill="none"><path d="M9 1L1 9l8 8" stroke={P} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/></svg>;
const Divider=({mode='light',label,style:ex={}})=>{const t=tok(mode);if(label)return <div style={{display:'flex',alignItems:'center',gap:12,...ex}}><div style={{flex:1,height:1,background:t.border}}/><span style={{fontSize:13,color:t.textTertiary,fontFamily:SF,fontWeight:500}}>{label}</span><div style={{flex:1,height:1,background:t.border}}/></div>;return <div style={{height:1,background:t.border,...ex}}/>;};
const FullScreen=({children,mode='light',style:ex={}})=>{const t=tok(mode);return <div style={{position:'absolute',inset:0,background:t.bg,display:'flex',flexDirection:'column',...ex}}>{children}</div>;};
const ScreenContent=({children,style:ex={}})=><div style={{position:'absolute',top:59,left:0,right:0,bottom:0,overflowY:'hidden',...ex}}>{children}</div>;
const LevelBadge=({level=12,size='sm'})=>{const lg=size==='lg';return <div style={{background:DojiT.sem.level,color:'#fff',fontSize:lg?14:11,fontWeight:800,padding:lg?'5px 12px':'3px 7px',borderRadius:100,letterSpacing:'0.02em',fontFamily:SF,flexShrink:0}}>Lv.{level}</div>;};
const CurrencyPill=({amount=1250,mode='light'})=>{const t=tok(mode);return <div style={{display:'inline-flex',alignItems:'center',gap:5,background:t.surface,borderRadius:100,padding:'6px 12px',border:`1px solid ${t.border}`}}><div style={{width:14,height:14,borderRadius:'50%',background:DojiT.sem.xpGold}}/><span style={{fontSize:14,fontWeight:700,color:t.textPrimary,fontFamily:SF}}>{amount.toLocaleString()}</span></div>;};
const ChallengeBadge=({type='poll',mode='light'})=>{const map={poll:{label:'POLL',color:'#2196F3'},wyr:{label:'WOULD YOU RATHER',color:'#9C27B0'},photo:{label:'PHOTO',color:DojiT.sem.success},qa:{label:'OPEN QUESTION',color:P}};const{label,color}=map[type]||map.poll;return <div style={{display:'inline-flex',alignItems:'center',gap:5,background:`${color}1A`,borderRadius:100,padding:'5px 12px'}}><div style={{width:6,height:6,borderRadius:'50%',background:color}}/><span style={{fontSize:11,fontWeight:800,color,fontFamily:SF,letterSpacing:'0.08em'}}>{label}</span></div>;};
const CountdownTimer=({time='7:42',urgent=false,size='md'})=>{const color=urgent?DojiT.sem.error:P;const lg=size==='lg';return <div style={{display:'inline-flex',alignItems:'center',gap:7,background:`${color}1A`,borderRadius:100,padding:lg?'10px 20px':'7px 14px'}}><div style={{width:lg?10:8,height:lg?10:8,borderRadius:'50%',background:color,animation:'doji-pulse 1.5s ease-in-out infinite'}}/><span style={{fontSize:lg?20:16,fontWeight:700,color,fontFamily:SF,fontVariantNumeric:'tabular-nums',letterSpacing:'-0.02em'}}>{time}</span></div>;};
const XPBar=({current=2340,max=3000,mode='light'})=>{const t=tok(mode);const pct=Math.min((current/max)*100,100);return <div style={{width:'100%'}}><div style={{display:'flex',justifyContent:'space-between',marginBottom:7}}><span style={{fontSize:12,color:t.textTertiary,fontFamily:SF}}>{current.toLocaleString()} XP</span><span style={{fontSize:12,color:t.textTertiary,fontFamily:SF}}>{max.toLocaleString()} XP to Lv.13</span></div><div style={{height:7,background:t.surface,borderRadius:100,overflow:'hidden',border:`1px solid ${t.border}`}}><div style={{width:`${pct}%`,height:'100%',background:P,borderRadius:100}}/></div></div>;};
const StatChip=({label,value,mode='light'})=>{const t=tok(mode);return <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:2}}><span style={{fontSize:20,fontWeight:800,color:t.textPrimary,fontFamily:SF}}>{value}</span><span style={{fontSize:11,color:t.textTertiary,fontFamily:SF,fontWeight:500}}>{label}</span></div>;};
const ReactionBar=({mode='light',active=null,counts={}})=>{const t=tok(mode);const rxns=[{id:'fire',e:'🔥',n:counts.fire||24},{id:'dead',e:'💀',n:counts.dead||8},{id:'lol',e:'😂',n:counts.lol||41},{id:'wow',e:'😮',n:counts.wow||12},{id:'goat',e:'🏆',n:counts.goat||6},{id:'love',e:'❤️',n:counts.love||33}];return <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>{rxns.map(r=>{const on=active===r.id;return <div key={r.id} style={{display:'inline-flex',alignItems:'center',gap:4,background:on?`${P}20`:t.surface,border:`1px solid ${on?P:t.border}`,borderRadius:100,padding:'5px 10px'}}><span style={{fontSize:14}}>{r.e}</span><span style={{fontSize:12,fontWeight:on?700:500,color:on?P:t.textSecondary,fontFamily:SF}}>{r.n}</span></div>;})}</div>;};
const VoteBar=({label,pct=60,isChosen=false,avatarSeeds=[],mode='light'})=>{const t=tok(mode);return <div style={{position:'relative',borderRadius:12,overflow:'hidden',marginBottom:8}}><div style={{position:'absolute',inset:0,background:isChosen?`${P}20`:t.surface,borderRadius:12}}><div style={{height:'100%',width:`${pct}%`,background:isChosen?`${P}30`:`${t.textTertiary}18`,borderRadius:12}}/></div><div style={{position:'relative',display:'flex',alignItems:'center',padding:'11px 14px',justifyContent:'space-between',border:`1.5px solid ${isChosen?P:t.border}`,borderRadius:12}}><div style={{display:'flex',alignItems:'center',gap:8}}>{isChosen&&<svg width="16" height="16" viewBox="0 0 16 16" fill={P}><path d="M13.5 4L6 11.5 2.5 8" stroke={P} strokeWidth="2" strokeLinecap="round" fill="none"/></svg>}<span style={{fontSize:14,fontWeight:isChosen?700:500,color:isChosen?P:t.textPrimary,fontFamily:SF}}>{label}</span></div><div style={{display:'flex',alignItems:'center',gap:6}}><div style={{display:'flex'}}>{avatarSeeds.slice(0,4).map((s,i)=><div key={i} style={{marginLeft:i>0?-6:0}}><Avatar size={20} seed={s}/></div>)}</div><span style={{fontSize:13,fontWeight:600,color:isChosen?P:t.textSecondary,fontFamily:SF}}>{pct}%</span></div></div></div>;};
const PostHeader=({seed=0,name,username,time='2m ago',mode='light'})=>{const t=tok(mode);const names=['Alex Johnson','Priya Kumar','Marcus T','Zoe Lee','Emma Wright','Frank Zhang'];const users=['@alexj','@priyak','@marcust','@zoeleee','@emmaw','@frankz'];return <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}><Avatar size={36} seed={seed}/><div style={{flex:1}}><div style={{display:'flex',alignItems:'baseline',gap:5}}><span style={{fontSize:14,fontWeight:700,color:t.textPrimary,fontFamily:SF}}>{name||names[seed%names.length]}</span><span style={{fontSize:13,color:t.textTertiary,fontFamily:SF}}>{username||users[seed%users.length]}</span></div><span style={{fontSize:12,color:t.textTertiary,fontFamily:SF}}>{time}</span></div></div>;};
const LockedCard=({mode='light',text="Complete today's Doji",seed=0})=>{const t=tok(mode);return <div style={{background:t.surfaceElevated,borderRadius:16,padding:16,marginBottom:12,border:`1px solid ${t.border}`}}><div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}><Avatar size={36} seed={seed}/><div><div style={{height:10,width:100,background:t.border,borderRadius:4,marginBottom:6}}/><div style={{height:9,width:70,background:t.surface,borderRadius:4}}/></div></div><div style={{height:80,background:t.surface,borderRadius:12,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:8}}><svg width="22" height="26" viewBox="0 0 22 26" fill="none"><rect x="1" y="11" width="20" height="14" rx="4" stroke={t.textTertiary} strokeWidth="1.8"/><path d="M5 11V8a6 6 0 1112 0v3" stroke={t.textTertiary} strokeWidth="1.8" strokeLinecap="round"/><circle cx="11" cy="18" r="2" fill={t.textTertiary}/></svg>{text&&<span style={{fontSize:12,color:t.textTertiary,fontFamily:SF,fontWeight:500}}>{text}</span>}</div><div style={{display:'flex',gap:6,marginTop:12}}>{['—','—','—','—','—','—'].map((_,i)=><div key={i} style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:100,padding:'5px 10px'}}><span style={{fontSize:12,color:t.textTertiary,fontFamily:SF}}>—</span></div>)}</div></div>;};

// ─────────────────────────────────────────────────────────────
// SCREEN COMPONENTS
// ─────────────────────────────────────────────────────────────

// 1 – Splash
const S01=({mode})=>{const t=tok(mode);return <FullScreen mode={mode} style={{alignItems:'center',justifyContent:'center'}}><StatusBar mode={mode}/><div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:20}}><div style={{width:96,height:96,borderRadius:28,background:P,display:'flex',alignItems:'center',justifyContent:'center',boxShadow:`0 16px 48px ${P}50`}}><svg width="52" height="52" viewBox="0 0 52 52" fill="none"><circle cx="26" cy="26" r="18" stroke="#fff" strokeWidth="4"/><circle cx="26" cy="26" r="6" fill="#fff"/><path d="M26 8V4M26 48v-4M44 26h4M4 26h4" stroke="#fff" strokeWidth="3.5" strokeLinecap="round"/></svg></div><div style={{textAlign:'center'}}><div style={{fontSize:42,fontWeight:900,color:t.textPrimary,fontFamily:SF,letterSpacing:'-0.03em',lineHeight:1}}>doji</div><div style={{fontSize:15,color:t.textSecondary,fontFamily:SF,marginTop:10}}>One challenge. Ten minutes. Every day.</div></div></div><div style={{position:'absolute',bottom:60,display:'flex',gap:6}}>{[1,2,3].map(i=><div key={i} style={{width:i===1?20:6,height:6,borderRadius:100,background:i===1?P:t.border}}/>)}</div></FullScreen>;};

// 2 – Welcome

function App() {
  const [active, setActive] = React.useState('onboarding');
  React.useEffect(() => {
    const main = document.getElementById('main-scroll');
    if (!main) return;
    const onScroll = () => {
      const sections = navSections.map(s => document.getElementById(s.id)).filter(Boolean);
      const scrollTop = main.scrollTop + 100;
      let cur = 'onboarding';
      for (const sec of sections) {
        if (sec.offsetTop <= scrollTop) cur = sec.id;
      }
      setActive(cur);
    };
    main.addEventListener('scroll', onScroll);
    return () => main.removeEventListener('scroll', onScroll);
  }, []);

  return (
    <div id="app-inner" style={{display:'flex',width:'100%',height:'100vh',overflow:'hidden'}}>
      <Sidebar activeSection={active}/>
      <div id="main-scroll" style={{flex:1,overflowY:'auto',padding:'40px 48px 80px'}}>

          <ScreenRow label="04 · How It Works" lightScreen={<S04 mode="light"/>} darkScreen={<S04 mode="dark"/>}/>
          <ScreenRow label="05 · Notifications Permission" lightScreen={<S05 mode="light"/>} darkScreen={<S05 mode="dark"/>}/>
          <ScreenRow label="06 · Profile Setup" lightScreen={<S06 mode="light"/>} darkScreen={<S06 mode="dark"/>}/>
          <ScreenRow label="07 · Account Type" lightScreen={<S07 mode="light"/>} darkScreen={<S07 mode="dark"/>}/>
        </Section>

        <Section id="auth" title="Authentication" subtitle="Screens 8–11">
