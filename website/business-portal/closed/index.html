<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Doji · Business portal</title>
    <link rel="icon" href="/assets/doji-icon.png" />
    <script src="/theme-init.js"></script>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/portal.css" />
    <link rel="stylesheet" href="/application.css" />
  </head>
  <body class="portalPage" data-portal="business-closed">
    <header class="onboardingHeader">
      <a class="portalBrand" href="https://dojipro.com/">
        <img src="/assets/doji-icon.png" alt="" />
        <span>Doji<small>Business portal</small></span>
      </a>
      <button class="themeToggle" type="button" data-action="toggle-theme">
        <span data-theme-label>Dark mode</span>
      </button>
    </header>
    <main class="applicationMain">
      <section class="onboardingCard" aria-labelledby="businessHeading">
        <p class="eyebrow">Doji for business</p>
        <h1 id="businessHeading">Something good is taking shape.</h1>
        <p>We're getting the business portal ready. Signups and business applications aren't open yet.</p>
        <p>Please check back soon.</p>
        <div class="applicationActions">
          <a class="portalButton primary" href="https://dojipro.com/">Back to Doji</a>
        </div>
      </section>
    </main>
    <script src="/portal-select.js"></script>
    <script src="/portal.js"></script>
  </body>
</html>
